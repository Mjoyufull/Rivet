[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Matrix SDK
matrix-sdk = { version = "0.16.0", default-features = false, features = ["markdown", "sqlite", "e2e-encryption", "qrcode", "rustls-tls", "automatic-room-key-forwarding"] }
matrix-sdk-ui = { version = "0.16.0", default-features = false, features = ["rustls-tls"] }

# UI
gpui = "0.2.2"
gpui-macros = "0.2.2"
gpui-component = "0.5.1"

# Common
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
tracing = "0.1"
anyhow = "1.0"
log = "0.4"
raw-window-handle = "0.6"
smallvec = "1.0"
smol = "2.0"
chrono = "0.4"
humansize = "2.0"
ruma = { version = "0.12.1", features = ["client-api"] }
livekit = "0.7.29"
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

# Extra for gpui-component
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
rust-i18n = "3"
schemars = "1"
tracing-subscriber = "0.3"

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
